<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gemelos digitales</title><style>body{margin:0;background:#eef3f7;color:#17334b;font:16px system-ui}header{background:#12334c;color:white;padding:32px 6%}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border:1px solid #d7e2eb;border-radius:14px;padding:22px;margin:16px 0}button,select,input{font:inherit;padding:9px;border:1px solid #b6c8d5;border-radius:7px}button{background:#007c83;color:white;cursor:pointer;margin:4px}label{display:inline-block;margin:8px}.metrics{display:flex;flex-wrap:wrap;gap:12px}.metric{background:#e9f3f5;padding:16px;border-radius:9px;min-width:100px}.metric b{display:block;font-size:25px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}pre{white-space:pre-wrap;overflow:auto}small{color:#52667a} .metric{flex:1;border-left:4px solid #007c83}.chart{width:100%;height:auto;max-height:300px}.tablewrap{overflow:auto}th{background:#12334c;color:white}tr:nth-child(even){background:#eef5f8}.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}.stage{background:#edf5f6;border-radius:10px;padding:12px;border-top:4px solid #007c83}.stage span{display:block;background:white;margin:5px 0;padding:6px;border-radius:5px;font-size:12px}button:disabled{opacity:.5} .error{color:#a32222} </style><header><h1>Laboratorio de gemelos digitales</h1>Modelos y simulación · Python + HTML</header><main><section><button onclick="tipo='ot';config()">Órdenes de trabajo</button><button onclick="tipo='aeropuerto';config()">Aeropuerto</button><h2 id="titulo"></h2><div id="controles"></div><button onclick="run()">Reiniciar / generar jornada</button><button onclick="step()">Avanzar 10 min</button><button onclick="play()">Animar / pausar</button><button onclick="sync()">Sincronizar</button><button onclick="compare()">Comparar escenarios</button><p id="status"></p></section><section><h2>Estado reproducido</h2><div class="metrics" id="metrics"></div><div id="stages"></div><div id="trend"></div><div style="overflow:auto;max-height:350px"><table id="board"></table></div></section><section><h2>Experimentos desde inicio de jornada</h2><small>Comparación exploratoria con semilla común; no equivale a la comparación final de 5.000 réplicas.</small><div id="results"></div></section><section><h2>Modelos estadísticos</h2><button onclick="models()">Consultar modelos</button><div id="fits"></div></section></main><script>
let tipo='ot',plan=null,t=0,snapshot=null,timer=null;const $=id=>document.getElementById(id);function config(){clearInterval(timer);timer=null;plan=null;snapshot=null;t=0;$('metrics').innerHTML='';$('board').innerHTML='';$('results').textContent='';$('titulo').textContent=tipo==='ot'?'Operación de cuadrillas':'Atención aeroportuaria';$('controles').innerHTML=tipo==='ot'?`<label>Fecha <input id="fecha" type="date" value="2026-06-03"></label><label>Estrategia <select id="estrategia">${['FIFO','Vencimiento','Traslado','Mamdani','Optimizador'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Cuadrillas extra <input id="extra" type="number" min="0" max="20" value="0"></label><label>Kits <input id="kits" type="number" min="0" value="200"></label>`:`<label>Agentes <input id="agentes" type="number" min="1" value="3"></label><label>Pasajeros/h <input id="tasa" type="number" min="1" value="30"></label><label>Servicio medio (min) <input id="media" type="number" min="1" value="5"></label>`; $('status').textContent='Genera una jornada para comenzar.'}function params(){let d={tipo,seed:42};for(let x of $('controles').querySelectorAll('input,select'))d[x.id]=x.type==='number'?Number(x.value):x.value;return d}async function api(d){let r=await fetch('./simular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}async function run(){clearInterval(timer);timer=null;$('status').textContent='Calculando jornada…';try{plan=await api(params());t=0;snapshot=null;draw()}catch(e){$('status').textContent=e.message}}function draw(){if(!plan)return;let done=plan.plan.filter(x=>x.fin<=t).length;let active=plan.plan.filter(x=>x.inicio<=t&&x.fin>t);$('metrics').innerHTML=Object.entries({Minuto:t,Terminadas:done,Activas:active.length,Total:plan.total}).map(([k,v])=>`<div class="metric">${k}<b>${v}</b></div>`).join('');$('board').innerHTML='<tr><th>Entidad</th><th>Recurso</th><th>Estado</th></tr>'+active.map(x=>`<tr><td>${x.id||'Pasajero'}</td><td>${x.cuadrilla||x.agente}</td><td>${tipo==='ot'?(t<x.material?'Materiales':t<x.traslado?'Traslado':'Ejecución'):'Atención'}</td></tr>`).join('');$('status').textContent=snapshot?`Copia sincronizada en minuto ${snapshot.t}; antigüedad ${t-snapshot.t} min`:'Sin sincronizar'}function step(){if(plan){t=Math.min(tipo==='ot'?540:120,t+10);draw()}}function play(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(step,500)}function sync(){if(plan){snapshot={t,plan:structuredClone(plan)};draw()}}async function compare(){let d=params(),a=tipo==='ot'?[d,{...d,extra:d.extra+1},{...d,kits:d.kits+10}]:[d,{...d,agentes:d.agentes+1},{...d,agentes:d.agentes+2}];$('results').textContent='Calculando…';try{let out=[];for(let p of a){let r=await api(p);delete r.plan;out.push({parametros:p,indicadores:r})}renderScenarios(out)}catch(e){$('results').textContent=e.message}}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${x}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}
const fmt=x=>typeof x==='number'?x.toLocaleString('es-CO',{maximumFractionDigits:3}):x;
function chart(labels,series){let W=800,H=260,L=65,B=45,M=Math.max(0.00001,...series.flatMap(s=>s.values));let n=labels.length,dx=(W-L-20)/Math.max(1,n);let colors=['#007c83','#e58a38','#4275c5'];let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><title>Gráfico de indicadores</title>`;for(let i=0;i<=4;i++){let y=H-B-i*(H-B-20)/4;svg+=`<line x1="${L}" x2="780" y1="${y}" y2="${y}" stroke="#d9e2ec"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="11">${fmt(M*i/4)}</text>`}series.forEach((s,k)=>{if(s.line){svg+=`<polyline fill="none" stroke="${colors[k]}" stroke-width="3" points="${s.values.map((v,i)=>`${L+(i+.5)*dx},${H-B-v/M*(H-B-20)}`).join(' ')}"/>`}else s.values.forEach((v,i)=>{let w=dx*.8/series.length,h=v/M*(H-B-20);svg+=`<rect x="${L+i*dx+dx*.1+k*w}" y="${H-B-h}" width="${w}" height="${h}" fill="${colors[k]}"><title>${fmt(v)}</title></rect>`})});labels.forEach((v,i)=>{if(i%Math.ceil(n/8)===0)svg+=`<text x="${L+(i+.5)*dx}" y="${H-B+18}" text-anchor="middle" font-size="11">${fmt(v)}</text>`});return svg+'</svg>'+series.map((s,k)=>`<span style="color:${colors[k]};margin-right:16px">● ${s.name}</span>`).join('')}
function renderScenarios(out){let names=tipo==='ot'?['Base','+1 cuadrilla','+10 kits']:['Base','+1 agente','+2 agentes'];let keys=Object.keys(out[0].indicadores);$('results').innerHTML=table(['Escenario',...keys],out.map((r,i)=>[names[i],...keys.map(k=>fmt(r.indicadores[k]))]))+chart(names,(tipo==='ot'?['terminadas','abiertas','incumplidas']:['terminadas','fila','riesgo']).map(k=>({name:k,values:out.map(r=>r.indicadores[k])})));}
async function models(){let el=$('fits');el.textContent='Calculando modelos…';try{if(tipo!=='ot'){el.innerHTML=table(['Variable','Distribución','Parámetros'],[['Llegadas','Exponencial','Media = 60 / tasa'],['Servicio','Gamma','Forma 2; escala = media / 2'],['Riesgo','Regla determinista','Umbral ilustrativo de 30 min']])+'<p>Supuestos sintéticos, no calibrados.</p>';return}let r=await fetch('./modelos'),d=await r.json();if(!r.ok)throw Error(d.error);el.innerHTML=Object.entries(d).map(([k,v])=>`<h3>${k.replaceAll('_',' ')}</h3><p>Observaciones: ${v.n} · Mejor AIC: ${v.ajustes[0].familia}</p>`+table(['Familia','Parámetros','AIC','BIC','P5','P95'],v.ajustes.map(a=>[a.familia,a.parametros.map(fmt).join(', '),fmt(a.aic),fmt(a.bic),fmt(a.p5),fmt(a.p95)]))+chart(v.x,[{name:'Histograma (densidad)',values:v.hist},{name:'Densidad ajustada',values:v.densidad,line:true}])).join('')}catch(e){el.textContent='Error: '+e.message}}
const originalDraw=draw;draw=function(){originalDraw();if(!plan)return;let active=plan.plan.filter(x=>x.inicio<=t&&x.fin>t),groups=tipo==='ot'?['Materiales','Traslado','Ejecución']:['Atención'];$('stages').innerHTML='<div class="stages">'+groups.map(g=>{let a=active.filter(x=>(tipo==='ot'?(t<x.material?'Materiales':t<x.traslado?'Traslado':'Ejecución'):'Atención')===g);return `<div class="stage"><b>${g} · ${a.length}</b>${a.map(x=>`<span>${x.cuadrilla||'Agente '+x.agente} · ${x.id||'Pasajero'}</span>`).join('')}</div>`}).join('')+'</div>';let times=Array.from({length:Math.floor(t/10)+1},(_,i)=>i*10);$('trend').innerHTML=chart(times,[{name:'Terminadas acumuladas',values:times.map(m=>plan.plan.filter(x=>x.fin<=m).length),line:true}]);};
const originalConfig=config;config=function(){originalConfig();for(let id of ['stages','trend','fits'])$(id).innerHTML='';};config();</script></html>
