<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gemelos digitales</title><style>body{margin:0;background:#eef3f7;color:#17334b;font:16px system-ui}header{background:#12334c;color:white;padding:32px 6%}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border:1px solid #d7e2eb;border-radius:14px;padding:22px;margin:16px 0}button,select,input{font:inherit;padding:9px;border:1px solid #b6c8d5;border-radius:7px}button{background:#007c83;color:white;cursor:pointer;margin:4px}label{display:inline-block;margin:8px}.metrics{display:flex;flex-wrap:wrap;gap:12px}.metric{background:#e9f3f5;padding:16px;border-radius:9px;min-width:100px}.metric b{display:block;font-size:25px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}pre{white-space:pre-wrap;overflow:auto}small{color:#52667a}</style><header><h1>Laboratorio de gemelos digitales</h1>Modelos y simulación · Python + HTML</header><main><section><button onclick="tipo='ot';config()">Órdenes de trabajo</button><button onclick="tipo='aeropuerto';config()">Aeropuerto</button><h2 id="titulo"></h2><div id="controles"></div><button onclick="run()">Reiniciar / generar jornada</button><button onclick="step()">Avanzar 10 min</button><button onclick="play()">Animar / pausar</button><button onclick="sync()">Sincronizar</button><button onclick="compare()">Comparar escenarios</button><p id="status"></p></section><section><h2>Estado reproducido</h2><div class="metrics" id="metrics"></div><div style="overflow:auto;max-height:350px"><table id="board"></table></div></section><section><h2>Experimentos desde inicio de jornada</h2><small>Comparación exploratoria con semilla común; no equivale a la comparación final de 5.000 réplicas.</small><pre id="results"></pre></section><section><h2>Modelos estadísticos</h2><button onclick="models()">Consultar modelos</button><pre id="fits"></pre></section></main><script>
let tipo='ot',plan=null,t=0,snapshot=null,timer=null;const $=id=>document.getElementById(id);function config(){clearInterval(timer);timer=null;plan=null;snapshot=null;t=0;$('metrics').innerHTML='';$('board').innerHTML='';$('results').textContent='';$('titulo').textContent=tipo==='ot'?'Operación de cuadrillas':'Atención aeroportuaria';$('controles').innerHTML=tipo==='ot'?`<label>Fecha <input id="fecha" type="date" value="2026-06-03"></label><label>Estrategia <select id="estrategia">${['FIFO','Vencimiento','Traslado','Mamdani','Optimizador'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Cuadrillas extra <input id="extra" type="number" min="0" max="20" value="0"></label><label>Kits <input id="kits" type="number" min="0" value="200"></label>`:`<label>Agentes <input id="agentes" type="number" min="1" value="3"></label><label>Pasajeros/h <input id="tasa" type="number" min="1" value="30"></label><label>Servicio medio (min) <input id="media" type="number" min="1" value="5"></label>`; $('status').textContent='Genera una jornada para comenzar.'}function params(){let d={tipo,seed:42};for(let x of $('controles').querySelectorAll('input,select'))d[x.id]=x.type==='number'?Number(x.value):x.value;return d}async function api(d){let r=await fetch('/simular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error('Error de simulación');return r.json()}async function run(){clearInterval(timer);timer=null;try{plan=await api(params());t=0;snapshot=null;draw()}catch(e){$('status').textContent=e.message}}function draw(){if(!plan)return;let done=plan.plan.filter(x=>x.fin<=t).length;let active=plan.plan.filter(x=>x.inicio<=t&&x.fin>t);$('metrics').innerHTML=Object.entries({Minuto:t,Terminadas:done,Activas:active.length,Total:plan.total}).map(([k,v])=>`<div class="metric">${k}<b>${v}</b></div>`).join('');$('board').innerHTML='<tr><th>Entidad</th><th>Recurso</th><th>Estado</th></tr>'+active.map(x=>`<tr><td>${x.id||'Pasajero'}</td><td>${x.cuadrilla||x.agente}</td><td>${tipo==='ot'?(t<x.material?'Materiales':t<x.traslado?'Traslado':'Ejecución'):'Atención'}</td></tr>`).join('');$('status').textContent=snapshot?`Copia sincronizada en minuto ${snapshot.t}; antigüedad ${t-snapshot.t} min`:'Sin sincronizar'}function step(){if(plan){t=Math.min(tipo==='ot'?540:120,t+10);draw()}}function play(){if(timer){clearInterval(timer);timer=null}else timer=setInterval(step,500)}function sync(){if(plan){snapshot={t,plan:structuredClone(plan)};draw()}}async function compare(){let d=params(),a=tipo==='ot'?[d,{...d,extra:d.extra+1},{...d,kits:d.kits+10}]:[d,{...d,agentes:d.agentes+1},{...d,agentes:d.agentes+2}];$('results').textContent='Calculando…';try{let out=[];for(let p of a){let r=await api(p);delete r.plan;out.push({parametros:p,indicadores:r})}$('results').textContent=JSON.stringify(out,null,2)}catch(e){$('results').textContent=e.message}}async function models(){$('fits').textContent=tipo==='ot'?JSON.stringify(await (await fetch('/modelos')).json(),null,2):'Supuestos sintéticos: llegadas exponenciales (60/tasa minutos), servicio Gamma (forma 2, escala media/2). Umbral ilustrativo de 30 minutos; no representa pérdida real de vuelo.'}config();</script></html>
